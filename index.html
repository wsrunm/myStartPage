<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- 모바일 터치 드래그 앤 드롭 지원 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #58a6ff;
      --danger: #f85149;
      --text: #c9d1d9;
      --text-bright: #ffffff;
      --text-muted: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1.25rem;
    }
    .container { width: 100%; max-width: 1180px; display: flex; flex-direction: column; gap: 1.25rem; }

    /* Header & Clock */
    .header { text-align: center; }
    .clock { font-size: 2.6rem; font-weight: 700; color: var(--text-bright); }
    .date { color: var(--text-muted); font-size: 0.9rem; margin-top: 2px; }

    /* Search & Controls */
    .search-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-bright);
      font-size: 1rem;
    }
    .controls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.5rem; }
    .btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }
    .btn:hover, .btn.active { color: var(--accent); border-color: var(--accent); }
    .btn-primary { color: var(--accent); border-color: rgba(88, 166, 255, 0.4); }

    /* Grid & Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.25rem;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s, transform 0.2s, opacity 0.2s;
      user-select: none;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--card-border);
    }
    .card-title-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-grow: 1;
      overflow: hidden;
    }
    .drag-handle {
      color: var(--text-muted);
      cursor: grab;
      font-size: 0.95rem;
      display: none;
      padding-right: 0.2rem;
    }
    body.edit-mode .drag-handle { display: inline-block; }
    .drag-handle:active { cursor: grabbing; }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .badge {
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      font-size: 0.75rem;
      padding: 0.15rem 0.45rem;
      border-radius: 10px;
    }
    .edit-cat-btn, .del-cat-btn {
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.2rem 0.35rem;
      display: none;
      border-radius: 4px;
    }
    .edit-cat-btn { color: var(--text-muted); }
    .edit-cat-btn:hover { color: var(--accent); }
    .del-cat-btn { color: var(--danger); }
    .del-cat-btn:hover { opacity: 0.8; }
    
    body.edit-mode .edit-cat-btn,
    body.edit-mode .del-cat-btn { display: inline-block; }

    /* Drag & Drop Visual State */
    .sortable-ghost {
      opacity: 0.35;
      border: 2px dashed var(--accent) !important;
      transform: scale(0.98);
    }
    .sortable-chosen {
      background: rgba(88, 166, 255, 0.08) !important;
    }

    /* Link Items */
    .link-list { list-style: none; display: flex; flex-direction: column; gap: 0.35rem; }
    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.2s;
    }
    .link-item:hover { background: rgba(255, 255, 255, 0.06); }
    .link-item a {
      color: var(--text);
      text-decoration: none;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-grow: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .link-item a:hover { color: var(--text-bright); }
    .del-btn {
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.2rem 0.4rem;
      display: none;
    }
    .del-btn:hover { color: var(--danger); }
    body.edit-mode .del-btn { display: inline-block; }

    /* Add Forms */
    .add-form {
      margin-top: 0.8rem;
      display: flex;
      gap: 0.4rem;
    }
    .add-form input {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      color: var(--text-bright);
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      outline: none;
    }
    .add-form input.name { width: 40%; }
    .add-form input.url { width: 60%; }
    .add-form button {
      background: var(--accent);
      border: none;
      color: #000;
      font-weight: bold;
      border-radius: 6px;
      padding: 0 0.65rem;
      cursor: pointer;
    }
  </style>
</head>

    const STORAGE_KEY = 'my_hub_data_v6';
    let currentData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || initialTabsData;
    let isEditMode = false;
    let sortableInstance = null;

    function saveAndRender() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(currentData));
      renderGrid();
    }

    function renderGrid() {
      const container = document.getElementById('categoryGrid');
      container.innerHTML = '';

      currentData.forEach((cat, catIdx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('data-idx', catIdx);

        let listHtml = cat.items.map((item, itemIdx) => `
          <li class="link-item">
            <a href="${item.url}" target="_blank" rel="noopener">
              <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.72rem; color:var(--text-muted);"></i>
              ${item.name}
            </a>
            <i class="fa-solid fa-trash del-btn" title="링크 삭제" onclick="deleteLink(${catIdx}, ${itemIdx})"></i>
          </li>
        `).join('');

        card.innerHTML = `
          <div>
            <div class="card-header">
              <div class="card-title-wrap">
                <i class="fa-solid fa-grip-vertical drag-handle" title="드래그하여 이동"></i>
                <div class="card-title">
                  <i class="fa-solid ${cat.icon || 'fa-folder'}"></i>
                  <span id="cat-title-${catIdx}">${cat.category}</span>
                </div>
                <i class="fa-solid fa-pen edit-cat-btn" title="그룹명 수정" onclick="editCategoryName(${catIdx})"></i>
              </div>
              <div class="header-actions">
                <span class="badge">${cat.items.length}</span>
                <i class="fa-solid fa-trash del-cat-btn" title="그룹 전체 삭제" onclick="deleteCategory(${catIdx})"></i>
              </div>
            </div>
            <ul class="link-list">${listHtml}</ul>
          </div>
          <form class="add-form" onsubmit="addLink(event, ${catIdx})">
            <input type="text" class="name" placeholder="이름" required>
            <input type="url" class="url" placeholder="https://..." required>
            <button type="submit" title="링크 추가"><i class="fa-solid fa-plus"></i></button>
          </form>
        `;
        container.appendChild(card);
      });

      initSortable();
    }

    /* SortableJS 드래그 앤 드롭 초기화 */
    function initSortable() {
      const container = document.getElementById('categoryGrid');
      if (sortableInstance) {
        sortableInstance.destroy();
      }

      sortableInstance = new Sortable(container, {
        animation: 200,
        handle: '.card-header', /* 카드 상단 헤더 영역을 잡고 드래그 */
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        disabled: !isEditMode, /* 편집 모드일 때만 드래그 활성화 */
        delay: 150, /* 모바일 스크롤과 충돌 방지를 위해 150ms 롱터치 후 드래그 시작 */
        delayOnTouchOnly: true,
        onEnd: function (evt) {
          const movedItem = currentData.splice(evt.oldIndex, 1)[0];
          currentData.splice(evt.newIndex, 0, movedItem);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(currentData));
          renderGrid();
        }
      });
    }

    /* 그룹(카테고리) 관련 함수 */
    function addCategory() {
      const catName = prompt('새로 추가할 그룹(카테고리) 이름을 입력하세요:');
      if (catName && catName.trim() !== '') {
        currentData.push({
          category: catName.trim(),
          icon: 'fa-folder',
          items: []
        });
        saveAndRender();
      }
    }

    function editCategoryName(catIdx) {
      const currentName = currentData[catIdx].category;
      const newName = prompt('수정할 그룹 이름을 입력하세요:', currentName);
      if (newName && newName.trim() !== '' && newName.trim() !== currentName) {
        currentData[catIdx].category = newName.trim();
        saveAndRender();
      }
    }

    function deleteCategory(catIdx) {
      const catName = currentData[catIdx].category;
      if (confirm(`'${catName}' 그룹과 포함된 모든 링크를 삭제하시겠습니까?`)) {
        currentData.splice(catIdx, 1);
        saveAndRender();
      }
    }

    /* 링크 관련 함수 */
    function addLink(e, catIdx) {
      e.preventDefault();
      const form = e.target;
      const name = form.querySelector('.name').value.trim();
      let url = form.querySelector('.url').value.trim();
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      currentData[catIdx].items.push({ name, url });
      form.reset();
      saveAndRender();
    }

    function deleteLink(catIdx, itemIdx) {
      currentData[catIdx].items.splice(itemIdx, 1);
      saveAndRender();
    }

    /* 모드 전환 및 백업/복원 */
    function toggleEditMode() {
      isEditMode = !isEditMode;
      document.body.classList.toggle('edit-mode', isEditMode);
      document.getElementById('editBtn').classList.toggle('active', isEditMode);
      if (sortableInstance) {
        sortableInstance.option('disabled', !isEditMode);
      }
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "hub_backup.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json';
      input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = event => {
          try {
            currentData = JSON.parse(event.target.result);
            saveAndRender();
          } catch (err) {
            alert('올바른 JSON 파일이 아닙니다.');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function resetToInitial() {
      if (confirm('모든 링크와 그룹을 리서치 포함 기본 세팅으로 초기화하시겠습니까?')) {
        currentData = JSON.parse(JSON.stringify(initialTabsData));
        saveAndRender();
      }
    }

    /* 시계 */
    function updateTime() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit' });
      document.getElementById('date').textContent = now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    }
    setInterval(updateTime, 1000);
    updateTime();
    renderGrid();
  </script>
</body>
</html>
