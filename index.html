<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #58a6ff;
      --danger: #f85149;
      --text: #c9d1d9;
      --text-bright: #ffffff;
      --text-muted: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1.25rem;
    }
    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 1.25rem; }

    /* Clock */
    .header { text-align: center; }
    .clock { font-size: 2.6rem; font-weight: 700; color: var(--text-bright); }
    .date { color: var(--text-muted); font-size: 0.9rem; margin-top: 2px; }

    /* Search & Controls */
    .search-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-bright);
      font-size: 1rem;
    }
    .controls { display: flex; justify-content: flex-end; gap: 0.5rem; }
    .btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }
    .btn:hover, .btn.active { color: var(--accent); border-color: var(--accent); }

    /* Grid & Cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.25rem;
      backdrop-filter: blur(12px);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
    }
    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
    }
    .link-list { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; }
    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.2s;
    }
    .link-item:hover { background: rgba(255, 255, 255, 0.06); }
    .link-item a {
      color: var(--text);
      text-decoration: none;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-grow: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .link-item a:hover { color: var(--text-bright); }
    .del-btn {
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.2rem 0.4rem;
      display: none;
    }
    .del-btn:hover { color: var(--danger); }
    body.edit-mode .del-btn { display: inline-block; }

    /* Add Forms */
    .add-form {
      margin-top: 0.8rem;
      display: flex;
      gap: 0.4rem;
    }
    .add-form input {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      color: var(--text-bright);
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      outline: none;
    }
    .add-form input.name { width: 40%; }
    .add-form input.url { width: 60%; }
    .add-form button {
      background: var(--accent);
      border: none;
      color: #000;
      font-weight: bold;
      border-radius: 6px;
      padding: 0 0.6rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="clock" id="clock">00:00</div>
      <div class="date" id="date">Loading...</div>
    </div>

    <form class="search-box" action="https://www.google.com/search" method="get">
      <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
      <input type="text" name="q" placeholder="Google 검색..." autocomplete="off">
    </form>

    <div class="controls">
      <button class="btn" id="editBtn" onclick="toggleEditMode()"><i class="fa-solid fa-pen-to-square"></i> 편집</button>
      <button class="btn" onclick="exportData()"><i class="fa-solid fa-download"></i> 백업</button>
      <button class="btn" onclick="importData()"><i class="fa-solid fa-upload"></i> 복원</button>
    </div>

    <div class="grid" id="categoryGrid"></div>
  </div>

  <script>
    // 초기 기본 데이터 구조
    const defaultData = [
      {
        category: "Portals & Media",
        items: [
          { name: "Naver", url: "https://www.naver.com" },
          { name: "YouTube", url: "https://www.youtube.com" },
          { name: "Google News", url: "https://news.google.com" }
        ]
      },
      {
        category: "Dev & AI",
        items: [
          { name: "GitHub", url: "https://github.com" },
          { name: "ChatGPT", url: "https://chatgpt.com" },
          { name: "Gemini", url: "https://gemini.google.com" }
        ]
      },
      {
        category: "Market & Tools",
        items: [
          { name: "TradingView", url: "https://www.tradingview.com" },
          { name: "Yahoo Finance", url: "https://finance.yahoo.com" }
        ]
      }
    ];

    let currentData = JSON.parse(localStorage.getItem('my_hub_data')) || defaultData;
    let isEditMode = false;

    function saveAndRender() {
      localStorage.setItem('my_hub_data', JSON.stringify(currentData));
      renderGrid();
    }

    function renderGrid() {
      const container = document.getElementById('categoryGrid');
      container.innerHTML = '';

      currentData.forEach((cat, catIdx) => {
        const card = document.createElement('div');
        card.className = 'card';

        let listHtml = cat.items.map((item, itemIdx) => `
          <li class="link-item">
            <a href="${item.url}" target="_blank" rel="noopener">
              <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.75rem; color:var(--text-muted);"></i>
              ${item.name}
            </a>
            <i class="fa-solid fa-trash del-btn" onclick="deleteLink(${catIdx}, ${itemIdx})"></i>
          </li>
        `).join('');

        card.innerHTML = `
          <div class="card-header">
            <div class="card-title">${cat.category}</div>
          </div>
          <ul class="link-list">${listHtml}</ul>
          <form class="add-form" onsubmit="addLink(event, ${catIdx})">
            <input type="text" class="name" placeholder="이름" required>
            <input type="url" class="url" placeholder="https://..." required>
            <button type="submit"><i class="fa-solid fa-plus"></i></button>
          </form>
        `;
        container.appendChild(card);
      });
    }

    function addLink(e, catIdx) {
      e.preventDefault();
      const form = e.target;
      const name = form.querySelector('.name').value.trim();
      let url = form.querySelector('.url').value.trim();
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      currentData[catIdx].items.push({ name, url });
      saveAndRender();
    }

    function deleteLink(catIdx, itemIdx) {
      currentData[catIdx].items.splice(itemIdx, 1);
      saveAndRender();
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      document.body.classList.toggle('edit-mode', isEditMode);
      document.getElementById('editBtn').classList.toggle('active', isEditMode);
    }

    // 기기 간 동기화용 JSON 백업/복원
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "hub_backup.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json';
      input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = event => {
          try {
            currentData = JSON.parse(event.target.result);
            saveAndRender();
          } catch (err) {
            alert('올바른 JSON 파일이 아닙니다.');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function updateTime() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit' });
      document.getElementById('date').textContent = now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    }
    setInterval(updateTime, 1000);
    updateTime();
    renderGrid();
  </script>
</body>
</html>
